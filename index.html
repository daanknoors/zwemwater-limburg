<html lang="nl">
<head>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ──────────────────────────────────── */
    #sidebar {
      width: 300px;
      min-width: 300px;
      background: #fff;
      display: flex;
      flex-direction: column;
      box-shadow: 2px 0 10px rgba(0,0,0,.13);
      z-index: 1000;
      overflow-y: auto;
    }

    #sidebar-header {
      background: #1a3a52;
      color: #fff;
      padding: 18px 20px 14px;
      flex-shrink: 0;
    }

    #sidebar-header h1 { font-size: 17px; font-weight: 700; letter-spacing: .3px; }
    #sidebar-header p  { font-size: 12px; opacity: .75; margin-top: 3px; }

    #result-count {
      font-size: 12px;
      background: rgba(255,255,255,.15);
      border-radius: 12px;
      padding: 2px 10px;
      display: inline-block;
      margin-top: 8px;
    }

    .section {
      padding: 13px 20px;
      border-bottom: 1px solid #eef0f3;
    }

    .section-label {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .7px;
      color: #6b7280;
      margin-bottom: 9px;
    }

    /* ── Toggle switch ────────────────────────────── */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .toggle-label-text { font-size: 13px; color: #222; font-weight: 500; }
    .toggle-sublabel   { font-size: 11px; color: #9ca3af; margin-top: 2px; }

    .switch { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
    .switch input { display: none; }

    .slider {
      position: absolute; inset: 0;
      background: #d1d5db;
      border-radius: 24px;
      cursor: pointer;
      transition: .2s;
    }

    .slider:before {
      content: '';
      position: absolute;
      width: 18px; height: 18px;
      left: 3px; bottom: 3px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 1px 3px rgba(0,0,0,.22);
      transition: .2s;
    }

    input:checked + .slider               { background: #1a3a52; }
    input:checked + .slider:before        { transform: translateX(18px); }

    /* ── Chips ────────────────────────────────────── */
    .chip-group { display: flex; flex-wrap: wrap; gap: 6px; }

    .chip {
      cursor: pointer;
      padding: 4px 12px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 500;
      border: 1.5px solid #d1d5db;
      background: #fff;
      color: #555;
      transition: all .13s;
      user-select: none;
    }

    .chip:hover  { border-color: #1a3a52; color: #1a3a52; }
    .chip.active { background: #1a3a52; border-color: #1a3a52; color: #fff; }

    /* ── Legend ───────────────────────────────────── */
    .legend-item {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 5px;
      font-size: 12px;
      color: #374151;
    }

    .l-dot     { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
    .l-divider { height: 6px; }
    .l-line    { display: inline-block; width: 18px; height: 2px; background: #1a3a52; border-radius: 1px; flex-shrink: 0; opacity: 0.7; }

    .color-tip {
      font-size: 11px;
      color: #6b7280;
      background: #f9fafb;
      border-left: 3px solid #1a3a52;
      padding: 7px 10px;
      border-radius: 0 4px 4px 0;
      line-height: 1.55;
      margin-top: 8px;
    }

    /* ── Reset ────────────────────────────────────── */
    #reset-btn {
      margin: 12px 20px 16px;
      padding: 9px;
      width: calc(100% - 40px);
      background: #f3f4f6;
      border: none;
      border-radius: 7px;
      font-size: 13px;
      cursor: pointer;
      color: #374151;
      font-family: inherit;
      font-weight: 500;
      transition: background .13s;
    }

    #reset-btn:hover { background: #e5e7eb; }

    /* ── Boundary loading spinner ─────────────────── */
    #boundary-loader {
      font-size: 11px;
      color: #9ca3af;
      padding: 4px 20px 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .spinner {
      width: 12px; height: 12px;
      border: 2px solid #e5e7eb;
      border-top-color: #9ca3af;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Map ──────────────────────────────────────── */
    #map { flex: 1; height: 100vh; }

    /* ── Region label on map ──────────────────────── */
    .region-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: rgba(26, 58, 82, 0.45);
      pointer-events: none;
      white-space: nowrap;
      text-shadow: 0 0 6px rgba(255,255,255,.9);
    }

    /* ── Popup ────────────────────────────────────── */
    .popup-name {
      font-size: 13.5px;
      font-weight: 700;
      color: #1a3a52;
      margin-bottom: 4px;
      line-height: 1.35;
    }

    .popup-addr {
      font-size: 11px;
      color: #9ca3af;
      margin-bottom: 9px;
    }

    .popup-tags { display: flex; flex-wrap: wrap; gap: 4px; }

    .ptag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 500;
    }

    .ptag-pub  { background: #dbeafe; color: #1e40af; }
    .ptag-priv { background: #ffedd5; color: #9a3412; }
    .ptag-unk  { background: #f3f4f6; color: #6b7280; }
    .ptag-ja   { background: #dcfce7; color: #166534; }
    .ptag-nee  { background: #fee2e2; color: #991b1b; }
    .ptag-reg  { background: #f3f4f6; color: #4b5563; }

    .leaflet-popup-content { min-width: 220px; }
    .gemeente-tooltip { font-size: 11px; }
  </style>
</head>

// ── Municipality → region ─────────────────────────────
const GEMEENTE_REGION = {
  // Noord Limburg (7)
  'Bergen (L.)':'noord','Beesel':'noord','Gennep':'noord',
  'Horst aan de Maas':'noord','Peel en Maas':'noord','Venlo':'noord','Venray':'noord',
  // Midden Limburg (7)
  'Echt-Susteren':'midden','Leudal':'midden','Maasgouw':'midden',
  'Nederweert':'midden','Roerdalen':'midden','Roermond':'midden','Weert':'midden',
  // Zuid Limburg (17)
  'Beek':'zuid','Beekdaelen':'zuid','Brunssum':'zuid','Eijsden-Margraten':'zuid',
  'Gulpen-Wittem':'zuid','Heerlen':'zuid','Kerkrade':'zuid','Landgraaf':'zuid',
  'Maastricht':'zuid','Meerssen':'zuid','Simpelveld':'zuid','Sittard-Geleen':'zuid',
  'Stein':'zuid','Vaals':'zuid','Valkenburg aan de Geul':'zuid','Voerendaal':'zuid'
};

// ── Border styles ─────────────────────────────────────
const REGION_BORDER  = { color:'#1a3a52', weight:1.6, fillOpacity:0, opacity:0.6 };
const PROVINCE_BORDER = { color:'#1a3a52', weight:2.4, fillOpacity:0, opacity:0.8 };

// ── Map setup ─────────────────────────────────────────
const map = L.map('map', { zoomControl: true }).setView([51.12, 5.97], 9);

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

// ── Load boundaries from cartomap ─────────────────────
const GEM_URL = 'https://cartomap.github.io/nl/wgs84/gemeente_2023.geojson';

(async () => {
  const loader = document.getElementById('boundary-loader');
  loader.style.display = 'flex';
  try {
    const gemData = await fetch(GEM_URL).then(r => r.json());

    // 1. Merge municipalities per region → one clean outline per region
    const byRegion = { noord: [], midden: [], zuid: [] };
    gemData.features
      .filter(f => GEMEENTE_REGION[f.properties.statnaam])
      .forEach(f => byRegion[GEMEENTE_REGION[f.properties.statnaam]].push(f));

    const regionPolygons = {};
    Object.entries(byRegion).forEach(([region, features]) => {
      if (!features.length) return;
      let merged = features[0];
      for (let i = 1; i < features.length; i++) {
        try { merged = turf.union(merged, features[i]); } catch(e) {}
      }
      regionPolygons[region] = merged;
      L.geoJSON(merged, { style: REGION_BORDER }).addTo(map);
    });

    // 2. Province outer border = union of all three regions (same geometry, no mismatch)
    let province = regionPolygons['noord'];
    if (regionPolygons['midden']) province = turf.union(province, regionPolygons['midden']);
    if (regionPolygons['zuid'])   province = turf.union(province, regionPolygons['zuid']);
    L.geoJSON(province, { style: PROVINCE_BORDER }).addTo(map);

    // 3. Region name labels at approximate centroids
    [
      { lat: 51.52,  lon: 6.02,  text: 'Noord Limburg'  },
      { lat: 51.185, lon: 5.875, text: 'Midden Limburg' },
      { lat: 50.875, lon: 5.86,  text: 'Zuid Limburg'   },
    ].forEach(({ lat, lon, text }) => {
      L.marker([lat, lon], {
        icon: L.divIcon({
          html: `<div class="region-label">${text}</div>`,
          className: '',
          iconSize: [140, 20],
          iconAnchor: [70, 10]
        }),
        interactive: false,
        zIndexOffset: -500
      }).addTo(map);
    });

    loader.style.display = 'none';
  } catch (err) {
    console.warn('Boundary data not loaded:', err);
    loader.innerHTML = '<span style="color:#ef4444">Grenzen niet beschikbaar</span>';
    setTimeout(() => loader.style.display = 'none', 3000);
  }
})();

// ── Marker colour (single blue) ───────────────────────
const MARKER_COLOR = '#1565c0';
const TYPE_COLOR = { ja: MARKER_COLOR, nee: MARKER_COLOR, onbekend: MARKER_COLOR };

function makeIcon(type, dimmed) {
  const c = TYPE_COLOR[type] || TYPE_COLOR.onbekend;
  const op = dimmed ? 0.15 : 1;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="38" viewBox="0 0 28 38">
    <defs>
      <filter id="ds" x="-40%" y="-20%" width="180%" height="160%">
        <feDropShadow dx="0" dy="1.5" stdDeviation="1.5"
          flood-color="rgba(0,0,0,0.28)" flood-opacity="${dimmed ? 0 : 1}"/>
      </filter>
    </defs>
    <path fill="${c}" fill-opacity="${op}" stroke="white" stroke-width="1.8" filter="url(#ds)"
      d="M14 2C8.5 2 4 6.5 4 12c0 8 10 24 10 24s10-16 10-24C24 6.5 19.5 2 14 2z"/>
    <circle cx="14" cy="12" r="4.5" fill="white" fill-opacity="${op}"/>
  </svg>`;
  return L.divIcon({ html: svg, className: '', iconSize: [28,38], iconAnchor: [14,38], popupAnchor: [0,-40] });
}

// ── Popup helpers ─────────────────────────────────────
function pubTag(v) {
  if (v==='openbaar') return `<span class="ptag ptag-pub">Openbaar</span>`;
  if (v==='prive')    return `<span class="ptag ptag-priv">Privé</span>`;
  return `<span class="ptag ptag-unk">Onbekend</span>`;
}
function yesnoTag(v, yes, no) {
  if (v==='ja')  return `<span class="ptag ptag-ja">${yes}</span>`;
  if (v==='nee') return `<span class="ptag ptag-nee">${no}</span>`;
  return `<span class="ptag ptag-unk">Onbekend</span>`;
}

// ── Build markers + circles ───────────────────────────
const poolItems = DATA.map(d => {
  const m = L.marker([d.lat, d.lon], { icon: makeIcon(d.gemeente_eigenaar, false) });

  const addrLine = d.straat
    ? `${d.straat}${d.huisnr ? ' ' + d.huisnr : ''}, ${d.plaats}`
    : d.plaats;

  m.bindPopup(`
    <div class="popup-name">${d.name}</div>
    <div class="popup-addr">${addrLine}</div>
    <div class="popup-tags">
      ${pubTag(d.openbaar_of_prive)}
      ${yesnoTag(d.gemeente_eigenaar, 'Gemeente eigenaar', 'Geen gemeente eigenaar')}
      ${yesnoTag(d.abc_zwemmen, 'ABC-zwemmen', 'Geen ABC-zwemmen')}
      ${yesnoTag(d.senioren_gezondheid, 'Senioren / gezondheid', 'Geen senioren / gezondheid')}
      <span class="ptag ptag-reg">${d.regio.charAt(0).toUpperCase()+d.regio.slice(1)} Limburg</span>
    </div>`, { maxWidth: 290 });

  m.addTo(map);

  const cc = TYPE_COLOR[d.gemeente_eigenaar] || TYPE_COLOR.onbekend;
  const circle = L.circle([d.lat, d.lon], {
    radius: 5000,
    color: cc, fillColor: cc,
    fillOpacity: 0.07,
    weight: 1.5, opacity: 0.35,
    interactive: false
  });

  return { marker: m, circle, data: d };
});

// ── Filter state ──────────────────────────────────────
const filters = {
  openbaar: new Set(['openbaar','prive']),
  gemeente: new Set(['ja','nee']),
  abc:      new Set(['ja','nee']),
  senioren: new Set(['ja','nee']),
  regio:    new Set(['midden','noord','zuid']),
};
let circlesOn = false;

function matchesFilters(d) {
  return filters.openbaar.has(d.openbaar_of_prive)
      && filters.gemeente.has(d.gemeente_eigenaar)
      && filters.abc.has(d.abc_zwemmen)
      && filters.senioren.has(d.senioren_gezondheid)
      && filters.regio.has(d.regio);
}

function applyFilters() {
  let n = 0;
  poolItems.forEach(({ marker, circle, data }) => {
    const vis = matchesFilters(data);
    marker.setIcon(makeIcon(data.gemeente_eigenaar, !vis));
    marker.setZIndexOffset(vis ? 0 : -1000);
    if (circlesOn && vis) { if (!map.hasLayer(circle)) circle.addTo(map); }
    else                  { if (map.hasLayer(circle))  map.removeLayer(circle); }
    if (vis) n++;
  });
  document.getElementById('result-count').textContent = `${n} van ${DATA.length} locaties`;
}

// ── Circle toggle ─────────────────────────────────────
document.getElementById('circle-toggle').addEventListener('change', e => {
  circlesOn = e.target.checked;
  applyFilters();
});

// ── Chip toggles ──────────────────────────────────────
function setupGroup(id, key) {
  document.getElementById(id).addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    const val = chip.dataset.val;
    if (filters[key].has(val)) { filters[key].delete(val); chip.classList.remove('active'); }
    else                       { filters[key].add(val);    chip.classList.add('active'); }
    applyFilters();
  });
}

setupGroup('filter-openbaar', 'openbaar');
setupGroup('filter-gemeente', 'gemeente');
setupGroup('filter-abc',      'abc');
setupGroup('filter-senioren', 'senioren');
setupGroup('filter-regio',    'regio');

// ── Reset ──────────────────────────────────────────────
document.getElementById('reset-btn').addEventListener('click', () => {
  filters.openbaar = new Set(['openbaar','prive']);
  filters.gemeente = new Set(['ja','nee']);
  filters.abc      = new Set(['ja','nee']);
  filters.senioren = new Set(['ja','nee']);
  filters.regio    = new Set(['midden','noord','zuid']);
  document.querySelectorAll('.chip').forEach(c => c.classList.add('active'));
  document.getElementById('circle-toggle').checked = false;
  circlesOn = false;
  applyFilters();
});
</script>
